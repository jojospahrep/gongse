<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="講寫"><meta name="theme-color" content="#FFD21F"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-180.png"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style><script>window.STANDALONE=true</script></head><body><title>講寫 Gong Se</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Archivo+Narrow:wght@600;700&family=Archivo:wght@400;600;700&family=IBM+Plex+Mono:wght@400&family=Noto+Sans+HK:wght@400;700&family=Noto+Sans+SC:wght@400;700&family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+HK:wght@900&family=Noto+Serif+SC:wght@900&family=Noto+Serif+TC:wght@900&display=swap">
<style>/* Concept: Cantonese is a Hong Kong shopfront (painted signboard, tiled cafe wall, paper menu strips, order dockets, rubber stamps).
   Mandarin is a mainland office street (cobalt enamel plates, manuscript grid paper). Hard edges and ink lines throughout. */
:root{
  --wall:#BFE2D6;--grout:#A9D3C5;--tile:14px;--paper:#FFFEF7;--ink:#141412;--muted:#4C4C44;--line:#141412;--rule:#D8D5C6;
  --sign:#FFD21F;--sign-ink:#C2141B;--accent:#C2141B;--on-accent:#FFFFFF;--tab:#141412;--tab-ink:#FFFEF7;--tab-on:#FFD21F;--tab-on-ink:#141412;
  --s1:#FFE14D;--s2:#FF9DBB;--s3:#8FE3A0;--s4:#FFB45C;--s5:#9AD7FF;--strip-ink:#141412;
  --good:#0E6B3F;--good-bg:#DDF3E3;--bad:#B3141B;--bad-bg:#FBE1DC;
  --display:"Alfa Slab One","Rockwell",Georgia,serif;--label:"Archivo Narrow","Arial Narrow",sans-serif;--body:"Archivo",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--zh:"Noto Sans HK","PingFang HK","Microsoft JhengHei",sans-serif;--zhd:"Noto Serif HK","Songti TC","PMingLiU",serif;
}
body[data-lang="cmn"]{
  --wall:#F3F5FB;--grout:#CDD8F2;--tile:28px;--sign:#1238A8;--sign-ink:#FFFFFF;--accent:#1238A8;--on-accent:#FFFFFF;--tab:#0B1F66;--tab-ink:#FFFFFF;--tab-on:#FFFFFF;--tab-on-ink:#0B1F66;
  --s1:#C7D5FF;--s2:#FFE14D;--s3:#FFFFFF;--s4:#BCECD6;--s5:#FFCFC7;
  --zh:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;--zhd:"Noto Serif SC","Songti SC","SimSun",serif;
}
body[data-lang="cmn"][data-script="t"]{--zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;--zhd:"Noto Serif TC","Songti TC","PMingLiU",serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}
  :root:not([data-theme="light"]) body{--wall:#0D1412;--grout:#18231F;--paper:#191F1C;--ink:#F6F2E4;--muted:#AEB2A5;--line:#F6F2E4;--rule:#3A423D;--accent:#FF6F61;--on-accent:#1C0806;--tab:#000;--tab-ink:#F6F2E4;--good:#6FDBA3;--good-bg:#14352A;--bad:#FF8F84;--bad-bg:#3E1A17}
  :root:not([data-theme="light"]) body[data-lang="cmn"]{--wall:#0C1020;--grout:#18203A;--paper:#161B2E;--sign:#1E4AD6;--accent:#9DB3FF;--on-accent:#0A1030;--tab:#000;--s3:#E8ECF8}}
:root[data-theme="dark"]{color-scheme:dark}
:root[data-theme="dark"] body{--wall:#0D1412;--grout:#18231F;--paper:#191F1C;--ink:#F6F2E4;--muted:#AEB2A5;--line:#F6F2E4;--rule:#3A423D;--accent:#FF6F61;--on-accent:#1C0806;--tab:#000;--tab-ink:#F6F2E4;--good:#6FDBA3;--good-bg:#14352A;--bad:#FF8F84;--bad-bg:#3E1A17}
:root[data-theme="dark"] body[data-lang="cmn"]{--wall:#0C1020;--grout:#18203A;--paper:#161B2E;--sign:#1E4AD6;--accent:#9DB3FF;--on-accent:#0A1030;--tab:#000;--s3:#E8ECF8}
*{box-sizing:border-box}
body{color:var(--ink);font:16px/1.5 var(--body);min-height:100%;
  background-color:var(--wall);background-image:linear-gradient(var(--grout) 1px,transparent 1px),linear-gradient(90deg,var(--grout) 1px,transparent 1px);background-size:var(--tile) var(--tile)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sign)}
html{-webkit-text-size-adjust:100%}
[data-focus]{scroll-margin-bottom:120px}
button,a,label,input,textarea,select{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
input[type=search]{-webkit-appearance:none;appearance:none}
a.btn{display:inline-block;text-decoration:none}
h1,h2{font-family:var(--display);font-weight:400;line-height:1.08;margin:0;text-wrap:balance}
h1{font-size:clamp(2rem,6vw,3.3rem)}h2{font-size:1.45rem}
h3{font:700 1.05rem/1.2 var(--body);margin:0}
p{margin:0}a{color:var(--accent);font-weight:600}
.zh{font-family:var(--zh)}h1.zh,h2 .zh{font-family:var(--zhd);font-weight:900}
.rom{font-family:var(--mono);font-size:.88em;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:.875rem}
/* Signboard */
header.top{background:var(--sign);color:var(--sign-ink);border-bottom:4px solid var(--strip-ink);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:960px;margin:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;white-space:nowrap}
.brand b{font:900 clamp(2.2rem,7vw,3.1rem)/1 var(--zhd);letter-spacing:.08em}
.brand i{font:700 .8rem var(--label);letter-spacing:.14em;text-transform:uppercase;font-style:normal}
@media (max-width:420px){.brand i{display:none}}
.langs{display:flex;border:2.5px solid var(--strip-ink);background:#FFFEF7}
.langs button{border:0;background:transparent;color:#141412;font:700 1rem "Noto Sans HK",sans-serif;padding:7px 12px;cursor:pointer;min-height:40px}
.langs button+button{border-left:2.5px solid var(--strip-ink)}
.langs button.on[data-l="yue"]{background:#C2141B;color:#fff}.langs button.on[data-l="cmn"]{background:#1238A8;color:#fff}
.scr{border:2.5px solid var(--strip-ink);background:#FFFEF7;color:#141412;font:700 .85rem var(--zh);padding:7px 10px;cursor:pointer;min-height:40px}
/* Tab bar */
nav.main{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--tab);display:flex;justify-content:center;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
nav.main button{border:0;background:transparent;color:var(--tab-ink);cursor:pointer;padding:8px 16px;display:grid;justify-items:center;gap:0;min-width:0}
nav.main .nz{font:700 1.02rem/1.2 var(--zh)}nav.main .ne{font:600 .68rem/1.2 var(--label);letter-spacing:.1em;text-transform:uppercase;opacity:.8}
@media (hover:hover){nav.main button:hover{background:rgba(255,255,255,.12)}}
nav.main button.on{background:var(--tab-on);color:var(--tab-on-ink)}
main{max-width:960px;margin:auto;padding-block:26px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
main>*{min-width:0}
@media (max-width:720px){
  nav.main{position:fixed;left:0;right:0;bottom:0;top:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
  nav.main button{flex:1;padding:8px 2px}nav.main .ne{font-size:.62rem;letter-spacing:.04em}
}
/* Controls */
.btn{appearance:none;border:2.5px solid var(--line);background:var(--paper);color:var(--ink);font:700 .98rem var(--body);padding:10px 16px;cursor:pointer;min-height:46px;text-align:center;border-radius:0}
@media (hover:hover){.btn:hover{background:var(--s1);color:var(--strip-ink)}}
.btn.pri{background:var(--accent);color:var(--on-accent);box-shadow:4px 4px 0 var(--line);font-family:var(--label);font-size:1.1rem;letter-spacing:.03em;text-transform:uppercase}
@media (hover:hover){.btn.pri:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--line);background:var(--accent);color:var(--on-accent)}}
.btn.pri:active{transform:translate(4px,4px);box-shadow:none}
.btn.sm{padding:4px 10px;min-height:34px;font-size:.85rem;border-width:2px}.btn.sm.pri{font-size:.9rem;box-shadow:2px 2px 0 var(--line)}
.btn[disabled]{opacity:.45;cursor:default;box-shadow:none;transform:none}
:focus-visible{outline:3px solid var(--s2);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}
.stack{display:grid;gap:12px}.stack>*{min-width:0}
.panel{background:var(--paper);border:2.5px solid var(--line);padding:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.grid2>*{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:0;border-bottom:4px solid var(--line)}
.chip{border:2.5px solid var(--line);border-bottom:0;margin-right:-2.5px;background:var(--paper);color:var(--ink);padding:7px 14px;font:700 .95rem var(--label);letter-spacing:.02em;cursor:pointer;min-height:38px}
@media (hover:hover){.chip:hover{background:var(--s1);color:var(--strip-ink)}}.chip.on{background:var(--line);color:var(--paper)}
.tag{display:inline-block;background:var(--line);color:var(--paper);font:700 .76rem var(--label);letter-spacing:.09em;text-transform:uppercase;padding:3px 8px}
/* The sign tile holds the character. */
.tile{--t:clamp(160px,36vw,230px);min-width:var(--t);min-height:var(--t);max-width:100%;padding:22px;display:inline-flex;align-items:center;justify-content:center;text-align:center;background:var(--sign);color:var(--sign-ink);font-family:var(--zhd);font-weight:900;line-height:1.1;border:3px solid var(--strip-ink);outline:2px solid var(--sign-ink);outline-offset:-11px;box-shadow:7px 7px 0 var(--line)}
.tile.l1{font-size:clamp(5rem,17vw,7.4rem)}.tile.l2{font-size:clamp(3.4rem,11vw,4.8rem)}.tile.l3{font-size:clamp(2.3rem,8vw,3.2rem)}.tile.l4{font-size:clamp(1.7rem,6vw,2.4rem)}
.tilewrap{position:relative;display:inline-block;max-width:100%}.tilewrap .stamp{position:absolute;right:-14px;top:-14px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center}.hero>*{min-width:0}
.hero>.tile{min-width:var(--t);justify-self:start}
@media (max-width:560px){.hero{grid-template-columns:1fr;gap:24px}}
/* Rubber stamp */
.stamp{display:inline-grid;place-items:center;width:64px;height:64px;border:4px solid var(--stamp,#C2141B);border-radius:50%;color:var(--stamp,#C2141B);background:var(--paper);font:900 1.5rem/1 var(--zhd);transform:rotate(-12deg);outline:1.5px solid var(--stamp,#C2141B);outline-offset:-8px;white-space:nowrap}
.stamp.no{--stamp:#141412;font-size:1.05rem}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stamp.no{--stamp:#F6F2E4}}:root[data-theme="dark"] .stamp.no{--stamp:#F6F2E4}
/* Order docket for numbers */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;padding:0;border-top-width:8px;border-top-color:var(--accent)}
.stat{display:grid;gap:0;padding:14px 16px;border-right:1px dashed var(--muted);border-bottom:1px dashed var(--muted);margin:0 -1px -1px 0}
.stat b{font:400 2.2rem/1.1 var(--display);font-variant-numeric:tabular-nums}.stat span{color:var(--muted);font:600 .85rem/1.25 var(--label)}
.ex{display:grid;gap:18px;justify-items:start;background:var(--paper);border:2.5px solid var(--line);border-top:8px solid var(--accent);padding:22px}.ex>*{max-width:100%}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));width:100%}
.opt{text-align:left;font-weight:600}.opt.right{background:var(--good-bg);border-color:var(--good);color:var(--good)}.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.opt[disabled]{opacity:1}.opt[disabled]:not(.right):not(.wrong){opacity:.5}
input.ans,input[type=search]{width:100%;font:1.4rem var(--zh);padding:10px 2px;border:0;border-bottom:3px solid var(--line);background:transparent;color:var(--ink);border-radius:0}
input.ans[disabled]{color:var(--muted)}
textarea,select{width:100%;font:1.05rem var(--zh);padding:12px;border:2.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:0}
textarea{min-height:140px;resize:vertical;background-image:linear-gradient(transparent 31px,var(--rule) 32px);background-size:100% 32px;line-height:32px;padding-block:0}select{font-family:var(--body);font-size:1rem;min-height:46px}
input.ans:focus,input[type=search]:focus{outline:0;border-bottom-color:var(--accent)}
textarea:focus{outline:0;border-color:var(--accent)}
.say{font:700 1.5rem/1.35 var(--zh)}
.fb{position:relative;padding:12px 84px 12px 14px;width:100%;display:grid;gap:6px;border:2px dashed currentColor}.fb .stamp{position:absolute;right:10px;top:10px}
.fb.ok{background:var(--good-bg);color:var(--good)}.fb.no{background:var(--bad-bg);color:var(--bad)}
.fb .say,.fb .small{color:var(--ink)}.fb .lead{font:700 1rem var(--label);text-transform:uppercase;letter-spacing:.08em}
.miss{color:var(--bad);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;font-weight:700}
.progress{height:14px;width:100%;border:2.5px solid var(--line);background:var(--paper)}
.progress i{display:block;height:100%;background-color:var(--accent);background-image:linear-gradient(90deg,transparent 10px,var(--paper) 10px);background-size:12px 100%}
/* Paper strips: horizontal cards and the wall menu */
.card{display:grid;gap:4px;text-align:left;background:var(--s1);color:var(--strip-ink);border:2.5px solid var(--strip-ink);padding:14px;cursor:pointer;font:inherit;box-shadow:3px 3px 0 var(--line)}
.grid2>.card:nth-child(5n+2),.wallmenu>.vstrip:nth-child(5n+2){background:var(--s2)}.grid2>.card:nth-child(5n+3),.wallmenu>.vstrip:nth-child(5n+3){background:var(--s3)}.grid2>.card:nth-child(5n+4),.wallmenu>.vstrip:nth-child(5n+4){background:var(--s4)}.grid2>.card:nth-child(5n),.wallmenu>.vstrip:nth-child(5n){background:var(--s5)}
@media (hover:hover){.card:hover,.vstrip:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--line)}}
.card .ttl{font:900 1.3rem/1.2 var(--zhd)}.card .tag{justify-self:start;background:var(--strip-ink);color:#FFFEF7}
.card .muted,.vstrip .muted,.notice .muted{color:inherit;opacity:.82}
.wallmenu{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px;align-items:stretch}.wallmenu>*{min-width:0}
.vstrip{display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--s1);color:var(--strip-ink);border:2.5px solid var(--strip-ink);padding:12px 8px;cursor:pointer;font:inherit;box-shadow:3px 3px 0 var(--line);text-align:center}
.vstrip:nth-child(3n+1){transform:rotate(-.6deg)}.vstrip:nth-child(3n){transform:rotate(.5deg)}
.vs-kind{font:700 .68rem/1.15 var(--label);letter-spacing:.06em;text-transform:uppercase}
.vs-title{writing-mode:vertical-rl;font:900 1.5rem/1.15 var(--zhd);letter-spacing:.06em;flex:1;min-height:190px;display:flex;align-items:center}
.vs-en{font:600 .78rem/1.2 var(--label);border-top:1.5px solid currentColor;padding-top:6px;width:100%}
.vs-done{font:900 .82rem/1 var(--zhd);color:#C2141B;border:2px solid #C2141B;padding:3px 5px;transform:rotate(-8deg);background:#FFFEF7}
/* Reader */
.reader{font:1.32rem/2.05 var(--zh);background-color:var(--paper)}
body[data-lang="cmn"] .reader{background-image:linear-gradient(var(--grout) 1px,transparent 1px);background-size:100% 3.1rem}
.rline{display:flex;flex-wrap:wrap;align-items:flex-end;gap:0 1px;padding-block:6px;border-bottom:1px dashed var(--muted)}
.rline:last-child{border-bottom:0}
.tok{appearance:none;border:0;background:none;color:inherit;font:inherit;padding:0 1px;cursor:pointer;display:inline-flex;flex-direction:column;align-items:center;line-height:1.5}
@media (hover:hover){.tok:hover{background:var(--s1);color:var(--strip-ink)}.tok:hover small{color:inherit}}.tok.saved{box-shadow:inset 0 -3px 0 var(--accent)}.tok small{font:.62rem/1.2 var(--mono);color:var(--muted);white-space:nowrap}
.plain{padding:0 1px}
.play{border:0;background:transparent;color:var(--accent);cursor:pointer;font-size:1rem;padding:2px 6px;min-height:30px}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100% - 24px));background:var(--paper);color:var(--ink);border:3px solid var(--line);border-top:10px solid var(--accent);padding:14px;z-index:20;box-shadow:7px 7px 0 var(--line);display:grid;gap:6px}
.sheet .zh{font:900 2rem/1.1 var(--zhd)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(16px + env(safe-area-inset-top,0px));background:var(--s1);color:var(--strip-ink);border:2.5px solid var(--strip-ink);font-weight:700;padding:8px 14px;z-index:30;font-size:.9rem;max-width:calc(100% - 32px)}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.95rem}th,td{text-align:left;padding:8px 10px;border-bottom:1px dashed var(--muted);vertical-align:top}th{color:var(--ink);font:700 .78rem var(--label);letter-spacing:.08em;text-transform:uppercase;border-bottom:3px solid var(--line)}td.z{font:1.1rem var(--zh);white-space:nowrap}
.wordrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--muted)}.wordrow:last-child{border-bottom:0}.wordrow>*{min-width:0}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;border-bottom:3px solid var(--line)}
.barw{flex:1;height:100%;display:flex;align-items:flex-end;cursor:default;min-width:0}.barw i{display:block;width:100%;background:var(--accent);min-height:0}.barw:hover i{opacity:.75}
.axis{display:flex;justify-content:space-between;font:600 .78rem var(--label);color:var(--muted);font-variant-numeric:tabular-nums}
.tip{position:fixed;background:var(--line);color:var(--paper);font-size:.8rem;padding:4px 8px;pointer-events:none;z-index:40;font-variant-numeric:tabular-nums}
.bubble{padding:10px 14px;max-width:88%;display:grid;gap:4px;border:2px solid var(--line)}.bubble.me{background:var(--s1);color:var(--strip-ink);justify-self:end;box-shadow:-3px 3px 0 var(--line)}.bubble.them{background:var(--paper);box-shadow:3px 3px 0 var(--line)}
.bubble.me .small{color:inherit!important}
.notice{background:var(--s1);color:var(--strip-ink);border:2.5px solid var(--strip-ink);padding:12px 14px}
details summary{cursor:pointer;font-weight:700}
.tones{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.tonebtn{display:grid;gap:2px;justify-items:center}.tonebtn b{font:900 1.7rem var(--zhd)}.tonebtn:hover .rom,.tonebtn:hover .muted{color:inherit}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .14s ease-out}@keyframes pop{from{opacity:.5;translate:0 4px}to{opacity:1;translate:0 0}}
  .stamp{animation:thump .22s cubic-bezier(.2,1.6,.4,1)}@keyframes thump{from{scale:1.9;opacity:0}to{scale:1;opacity:1}}}
.cloze{font:700 1.2rem/1.5 var(--zh);border-left:4px solid var(--line);padding:4px 0 4px 10px}
.cloze b{color:var(--accent)}
a.card{text-decoration:none}
.res{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.res .card .ttl{font-size:1.1rem}
input.field{width:100%;font:1.05rem var(--body);padding:10px 12px;border:2.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:0;-webkit-appearance:none;appearance:none}
input.field:focus{outline:0;border-color:var(--accent)}
.lvl{font:700 .8rem var(--label);letter-spacing:.06em;text-transform:uppercase}
</style>
<header class="top"><div class="top-in">
  <span class="brand"><b id="brandz" lang="zh-HK">講寫</b><i id="brande">Gong Se</i></span>

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// Accounts (Home Screen app only): email sign-in through Supabase, one progress row per person.
// The anon key is public by design; row-level security on the table keeps each person to their own row.
const SUPA_URL = '';
const SUPA_KEY = '';
const AUTH_LS = 'gongse.auth';
const accountsOn = () => STANDALONE && !!SUPA_URL && !!SUPA_KEY;
let auth = null, cloudState = 'idle', cloudAt = 0;
try { auth = JSON.parse(localStorage.getItem(AUTH_LS)) || null; } catch {}
const signedIn = () => accountsOn() && !!auth?.user;
async function supa(path, { method = 'GET', body, bearer, prefer } = {}) {
  const headers = { apikey: SUPA_KEY, 'Content-Type': 'application/json' };
  if (bearer) headers.Authorization = 'Bearer ' + bearer;
  if (prefer) headers.Prefer = prefer;
  const r = await fetch(SUPA_URL + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  const t = await r.text(); let j = null; try { j = t ? JSON.parse(t) : null; } catch {}
  if (!r.ok) { const e = new Error(j?.msg || j?.error_description || j?.message || 'HTTP ' + r.status); e.status = r.status; e.code = j?.error_code || j?.code; throw e; }

async function signUp(email, password) {

  return 'confirm';

async function signIn(email, password) {

const sendReset = email => supa('/auth/v1/recover?redirect_to=' + encodeURIComponent(backHere()), { method: 'POST', body: { email } });

// Links in confirmation and reset emails come back with the session in the address hash.
async function readAuthHash() {
  if (!accountsOn() || !location.hash.includes('access_token=')) return null;
  const h = new URLSearchParams(location.hash.slice(1));
  history.replaceState(null, '', location.pathname + location.search);
  try {
    const user = await supa('/auth/v1/user', { bearer: h.get('access_token') });

async function cloudSync() {

const cur = () => ui.sess.queue[ui.sess.i];

function answer(ok, opts = {}) {
  const s = ui.sess, q = cur(), key = q.id + (q.k === 'mc' ? '|r' : '|w');

/* ---------- Placement ---------- */

}

    return `<section class="stack"><h1>${n === 0 ? 'Starting from the first level' : n === tot ? 'You passed every level' : `You passed ${n} of ${tot} levels`}</h1>
    <p class="lvl">Your level: ${S.level[p.l]} · ${esc(levelInfo(p.l, S.level[p.l]).en)}</p><p>${n ? 'Words in the levels you passed are marked as readable and come back for occasional review. You still practise typing them, because that is a separate skill.' : 'That is exactly what this course is for. The first words are the ones you already say every day.'}</p>
    <div class="row"><button class="btn pri" data-act="placeEnd">Go to Today</button></div></section>`;
  }

  return `<div class="row between"><button class="btn sm" data-act="placeQuit">Exit test</button><span class="small muted">Level ${p.li + 1} of ${p.levels.length}, question ${p.i + 1} of ${p.qs.length}</span></div>
  <section class="ex pop"><span class="tag">What does this mean?</span><div class="tile ${tileClass(z)}">${esc(z)}</div>
    <div class="opts">${q.opts.map((o, i) => `<button class="btn opt" data-act="placePick" data-i="${i}">${esc(o)}</button>`).join('')}<button class="btn opt" data-act="placePick" data-i="-1">I don't know</button></div></section>`;
}
function placePick(i) {
  const p = ui.pl, q = p.qs[p.i];
  if (i >= 0 && q.opts[i] === q.w.en) p.score++;
  p.i++;
  if (p.i < p.qs.length) return render();
  const lv = p.levels[p.li];
  if (p.score >= 5) {
    p.passed.push(lv); const d = today();
    for (const w of D[p.l].words.filter(w => w.lv === lv)) { S.cards[p.l][w.id + '|r'] = S.cards[p.l][w.id + '|r'] || { i: 14, e: 2.4, n: 2, f: 0, d: d + 3 + Math.floor(Math.random() * 12) }; }
    p.li++;
    if (p.li < p.levels.length) { p.qs = placeQs(p.l, p.levels[p.li]); p.i = 0; p.score = 0; return render(); }
  }
  p.done = true; S.placed[p.l] = true; S.level[p.l] = Math.min(p.passed.length + 1, maxLevel(p.l)); save(); render();
}

async function snapPhoto(file) {
  const l = L(), st = ui.own = ui.own || {};

  st.snapping = true; st.snapErr = null; st.snap = null; render();
